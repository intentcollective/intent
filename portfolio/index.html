<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry Kim</title>
<meta name="description" content="Henry Kim — Design portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <h1 class="name">Henry Kim</h1>
    <p class="manifesto">Design is the manifestation of human intent</p>
  </div>

  <div class="header-right">
    <nav class="main-nav" id="main-nav">
      <button class="nav-link is-active" data-category="Design" type="button">Design</button>
      <button class="nav-link" data-category="Education" type="button">Education</button>
    </nav>

    <div class="contact-row">
      <a class="contact-link" href="mailto:myautumnsky@gmail.com" aria-label="Email Henry Kim">@</a>
      <a class="contact-link linkedin" href="https://www.linkedin.com/in/myautumnsky/" target="_blank" rel="noopener" aria-label="Henry Kim on LinkedIn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="0" y="0" width="24" height="24" rx="2" fill="currentColor"/>
          <path d="M6.94 8.5H4.56V19h2.38V8.5zM5.75 7.13a1.38 1.38 0 1 0 0-2.76 1.38 1.38 0 0 0 0 2.76zM19.5 19h-2.38v-5.6c0-1.34-.03-3.06-1.87-3.06-1.87 0-2.16 1.46-2.16 2.96V19h-2.38V8.5h2.28v1.44h.03c.32-.6 1.1-1.24 2.27-1.24 2.43 0 2.88 1.6 2.88 3.68V19z" fill="#000"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main>
  <section class="grid" id="work-grid" aria-live="polite">
    <p class="grid-empty" id="grid-empty" hidden>No work to show yet.</p>
  </section>
</main>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> Henry Kim. All rights reserved.</p>
</footer>

<div class="modal" id="modal" hidden>
  <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
  <div class="modal-content" id="modal-content"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
