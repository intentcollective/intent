<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeitgeist | Intent Collective</title>
<meta name="description" content="Links and ideas shared by intent collective fellows.">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark-link">
      <img src="assets/wordmark.png" alt="Intent Collective">
    </a>
    <nav class="site-nav">
      <a href="index.html#manifesto" aria-label="Manifesto">M<span class="glyph glyph--a" aria-hidden="true"><svg viewBox="0 0 103 100" fill="none" stroke="currentColor" stroke-width="14" focusable="false"><path d="M51.5 9 98 91H5Z"/></svg></span>NIFESTO</a>
      <a href="structure.html" aria-label="Structure">STRUCTUR<span class="glyph glyph--e" aria-hidden="true"><svg viewBox="0 0 86 100" fill="none" stroke="currentColor" stroke-width="14" focusable="false"><path d="M4 8H82M4 50H82M4 92H82"/></svg></span></a>
      <a href="discourse.html" aria-label="Discourse">DISC<span class="glyph glyph--o" aria-hidden="true"><svg viewBox="0 0 106 100" focusable="false"><circle cx="53" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="14"/><circle cx="53" cy="50" r="18" fill="currentColor"/></svg></span>URSE</a>
      <a href="zeitgeist.html" aria-label="Zeitgeist" aria-current="page">ZEI<span class="glyph glyph--t" aria-hidden="true"><svg viewBox="0 0 83 100" fill="none" stroke="currentColor" stroke-width="14" focusable="false"><path d="M41.5 96V8M8 40 41.5 6 75 40"/></svg></span>GEIST</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="mark-label">Zeitgeist</div>
      <h1>Links and ideas from the fellows.</h1>
      <p class="lede">
        Click any card to read the preview in full, then follow the link out.
      </p>
    </div>
  </section>

  <div class="wrap">

    <div id="composer-region">
      <button type="button" id="compose-toggle" class="compose-toggle">+ Share a link</button>

      <div id="composer" class="composer hidden">
        <div class="field">
          <label for="compose-name">Name</label>
          <input type="text" id="compose-name" placeholder="Your name">
        </div>

        <div class="field">
          <label for="compose-title">Title</label>
          <input type="text" id="compose-title" placeholder="Headline of what you're sharing">
        </div>

        <div class="field">
          <label for="compose-link">Link</label>
          <input type="text" id="compose-link" placeholder="https://…">
        </div>

        <div class="field">
          <label for="compose-preview">Preview</label>
          <textarea id="compose-preview" rows="4" placeholder="A couple of sentences describing it"></textarea>
        </div>

        <div class="composer-actions">
          <input type="password" id="compose-password" placeholder="Password to publish">
          <button type="button" id="publish-btn" class="btn-primary">Publish</button>
          <span id="composer-status" class="composer-status" aria-live="polite"></span>
        </div>
      </div>
    </div>

    <div class="discourse-toolbar" id="discourse-toolbar">
      <span class="count" id="entry-count" aria-live="polite"></span>
    </div>

    <div id="state" class="state-msg">Loading links…</div>
    <article id="post-detail" class="post-detail" hidden></article>
    <div id="entry-grid" class="entry-grid" hidden></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year"></span> intent collective&trade;</span>
    <span><a href="mailto:intentcollectivedesign@gmail.com">intentcollectivedesign@gmail.com</a></span>
  </div>
</footer>

<script src="js/zeitgeist.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>

</body>
</html>
